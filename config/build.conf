# build.conf — single source of truth for the build. Sourced by bash (key="value" only,
# no logic). Validated by validate_config() in scripts/lib/common.sh.

# ---- identity -------------------------------------------------------------
DISTRO_ID="immos"                 # [a-z][a-z0-9-]*; used in partlabels, UKI names, unit names
DISTRO_NAME="Immutable OS"
VERSION="0.3.0"                     # X.Y.Z, strictly increasing across releases (strverscmp)
HOME_URL="https://immos.trinora.software"

# ---- updates --------------------------------------------------------------
UPDATE_CHANNEL="stable"
UPDATE_URL="https://immos.trinora.software/updates/stable"
UPDATE_VERIFY="0"                   # 1: require GPG-signed SHA256SUMS (needs config/keys/import-pubring.gpg)
                                    # 0: dev builds, transfers rendered with Verify=no

# ---- build inputs (pins) --------------------------------------------------
BUILDER_IMAGE="gentoo/stage3:amd64-systemd"
# A hard requirement, not advice: build.sh dies on an empty digest unless ALLOW_UNPINNED=1, and
# stage 80 refuses to assemble a release from a build that took the escape. A floating tag means
# the libc, compiler and profile the image is built against move under you with no diff anywhere.
BUILDER_DIGEST="sha256:689a1cfdfeceda1fb19c6cb057de04abfad43289278a9deb47eed0afaaa75872"

# The ebuild repo, pinned by COMMIT rather than by date (plan/15). distfiles.gentoo.org keeps
# roughly nine days of dated snapshots, so the previous pin — SNAPSHOT_DATE="20260819" — had
# already expired by 2026-08-27 and a clean builder image could no longer be built at all. That
# is a pin with a countdown on it. A commit in the rsync mirror is permanent and
# content-addressed, and once vendored (stage 90) it depends on nobody.
#
# NB the SHA is the MIRROR'S, not the development repo's. A synced tree's
# metadata/timestamp.commit names a commit in gentoo.git, whose SHAs this repository does not
# share — reading it off the tree and pasting it here produces a commit that does not exist.
TREE_REPO="https://github.com/gentoo-mirror/gentoo"
TREE_COMMIT="5b5d4f9a3857f639f2f7531630e7bb767c99b0f1"
# Derived from TREE_COMMIT, not independent of it: stage 10 asserts that the checked-out
# metadata/timestamp.chk parses to this date, so the two cannot drift apart silently. It stays a
# separate key because stage 60 derives SOURCE_DATE_EPOCH from it, and a wrong value there is not
# cosmetic — it silently broke autologin for two releases (see the long note in 60-image.sh).
SNAPSHOT_DATE="20260820"
PROFILE="default/linux/amd64/23.0/desktop/plasma/systemd"
# BUILDER-ONLY binhost: the builder installs its own tools (qemu, dracut, rsvg-convert, ...)
# as binary packages from here. The image does NOT use it — everything that ships is
# compiled by this pipeline or reused from its own /cache/binpkgs builds. See the NB in
# config/portage/make.conf.in for why, and builder/Dockerfile for the builder side.
BINHOST_URI="https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/"

# ---- image geometry (MiB) -------------------------------------------------
ESP_SIZE_MIB="1024"
ROOT_SLOT_SIZE_MIB="6144"
VAR_SIZE_MIB="4096"
EROFS_COMPRESSION="lz4hc,12"        # or: zstd,15

# ---- live user (v1 images double as live media; installer replaces this) --
LIVE_USER="live"
LIVE_USER_PASSWORD="live"

# ---- locales / fonts / options --------------------------------------------
LOCALE_GEN="en_US.UTF-8 UTF-8"      # /etc/locale.gen lines, ';'-separated for multiple
LOCALES_KEEP="en de fr es pt_BR it ja zh_CN ru"   # message catalogs kept by prune
INCLUDE_CJK_FONTS="1"
INCLUDE_PRINTING="1"

# ---- boot splash ----------------------------------------------------------
# Which of the splash's two halves the image gets. They cover different windows of the boot and
# neither can cover the other's, because this kernel has no simpledrm: nothing can draw between
# the firmware and the first real KMS driver except the EFI stub, and nothing can draw after the
# first modeset except a DRM client. See plan/14.
#
#   both      the whole timeline: the stub bitmap from the firmware through the initrd, then the
#             KMS splash from the first modeset to the greeter. The two are the same still image
#             at the same brightness, so the hand-off is invisible
#   stub      the systemd-stub bitmap alone; black from the first modeset to the greeter, which
#             is most of the boot. Useful as a control, not as a configuration
#   kms       no pre-kernel image; splash from the first modeset onward. The firmware logo stays
#             up until the modeset instead
#   none      neither; bare console (the control when comparing the other three)
#
# NOTHING about the image changes with this except at most one cmdline token. The splash binary,
# its assets, its unit and its udev rule are installed in all four modes — "off" is the single
# condition the unit itself carries (ConditionKernelCommandLine=!<id>.splash=0), exactly as
# plymouth's own unit used plymouth.enable=0 before it. So switching is a rerun of stages 40-60
# and nothing has to be rebuilt.
SPLASH_BACKEND="kms"           # both | stub | kms | none
# Effective scale of the STUB bitmap only, at the 1920x1080 design baseline (1 = 1080p, 2 = 4K).
# It needs a knob because systemd-stub runs before ExitBootServices, blits the bitmap 1:1 CENTRED
# with no scaling, and has no resolution to ask about at build time (src/boot/splash.c). The KMS
# half needs no equivalent: it reads the mode off the CRTC and picks its own sprite scale.
# Ignored unless SPLASH_BACKEND includes the stub.
SPLASH_STUB_SCALE="1"

# ---- initrd failure policy -------------------------------------------------
# 0: the UKI cmdline carries "rd.shell=0 rd.emergency=reboot", so an initrd that cannot find or
#    mount the root filesystem REBOOTS instead of dropping to a dracut shell. That is what makes
#    the A/B rollback in plan/01 automatic: systemd-boot decrements the entry's tries counter
#    when it boots it, but a machine sitting at an emergency prompt never finishes the attempt,
#    so a bad slot needed three manual power cycles to fall back. Rebooting spends the three
#    tries by itself, in seconds.
# 1: dev builds — keep the emergency shell. Worth knowing before you need it: loader.conf sets
#    "editor no" (stage 60) and the cmdline lives inside the signed-shaped UKI, so there is no
#    way to ask for the shell at boot time on an image built with 0. It is a rebuild of stages
#    40-60, not a boot-time choice.
DEBUG_INITRD="0"

# ---- flatpak ---------------------------------------------------------------
# Which apps. WHICH VERSIONS lives in config/flatpak/apps.lock, which pins every ref — apps and
# runtimes both — to an exact Flathub commit (plan/15). Adding an app here and rebuilding will
# fail stage 40's readback until the lock is regenerated:  scripts/relock.sh --flatpak
FLATPAK_PREINSTALL="org.mozilla.firefox org.kde.ark org.kde.kwrite org.kde.okular org.kde.gwenview"   # space-separated app IDs, each verified live on Flathub
# build:     installed into the image, and therefore pinnable by apps.lock.
# firstboot: installed on the device by a oneshot unit, months later — NOT pinnable by
#            construction, whatever apps.lock says.
FLATPAK_PREINSTALL_MODE="build"            # build: install into image; firstboot: oneshot unit

# ---- containers / distrobox ------------------------------------------------
# The mutable-userland escape hatch (plan/13). Flatpak packages application windows; it has no
# answer for "I need a package manager and a compiler". Distrobox runs a full mutable distro in
# a ROOTLESS podman container with $HOME, the Wayland socket, DBus and devices bound through, so
# the toolchain lives in /var — never on the read-only root. 0 drops podman, distrobox and their
# ~16-package tail from the image.
INCLUDE_DISTROBOX="1"
# What `distrobox create` uses when the user names no image. Deliberately FULLY QUALIFIED: an
# unqualified name would be resolved through containers-common's unqualified-search-registries,
# which is a registry-order heuristic this image should not depend on. Overridable per user in
# ~/.config/distrobox/distrobox.conf, and system-wide in /etc/distrobox/distrobox.conf (the /etc
# overlay makes that writable at runtime).
DISTROBOX_DEFAULT_IMAGE="docker.io/library/debian:stable"
