# build.conf — single source of truth for the build. Sourced by bash (key="value" only,
# no logic). Validated by validate_config() in scripts/lib/common.sh.

# ---- identity -------------------------------------------------------------
DISTRO_ID="immos"                 # [a-z][a-z0-9-]*; used in partlabels, UKI names, unit names
DISTRO_NAME="Immutable OS"
VERSION="0.2.0"                     # X.Y.Z, strictly increasing across releases (strverscmp)
HOME_URL="https://immos.trinora.software"

# ---- updates --------------------------------------------------------------
UPDATE_CHANNEL="stable"
UPDATE_URL="https://immos.trinora.software/updates/stable"
UPDATE_VERIFY="0"                   # 1: require GPG-signed SHA256SUMS (needs config/keys/import-pubring.gpg)
                                    # 0: dev builds, transfers rendered with Verify=no

# ---- build inputs (pins) --------------------------------------------------
BUILDER_IMAGE="gentoo/stage3:amd64-systemd"
BUILDER_DIGEST=""                   # sha256:… to pin; empty tolerated only for dev builds
SNAPSHOT_DATE="20260819"           # gentoo ebuild repo snapshot (YYYYMMDD)
                                    # NB: distfiles.gentoo.org keeps only ~9 days of
                                    # snapshots; an older pin 404s and stage 10 fails.
PROFILE="default/linux/amd64/23.0/desktop/plasma/systemd"
# BUILDER-ONLY binhost: the builder installs its own tools (qemu, dracut, rsvg-convert, ...)
# as binary packages from here. The image does NOT use it — everything that ships is
# compiled by this pipeline or reused from its own /cache/binpkgs builds. See the NB in
# config/portage/make.conf.in for why, and builder/Dockerfile for the builder side.
BINHOST_URI="https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/"

# ---- image geometry (MiB) -------------------------------------------------
ESP_SIZE_MIB="1024"
ROOT_SLOT_SIZE_MIB="6144"
VAR_SIZE_MIB="4096"
EROFS_COMPRESSION="lz4hc,12"        # or: zstd,15

# ---- live user (v1 images double as live media; installer replaces this) --
LIVE_USER="live"
LIVE_USER_PASSWORD="live"

# ---- locales / fonts / options --------------------------------------------
LOCALE_GEN="en_US.UTF-8 UTF-8"      # /etc/locale.gen lines, ';'-separated for multiple
LOCALES_KEEP="en de fr es pt_BR it ja zh_CN ru"   # message catalogs kept by prune
INCLUDE_CJK_FONTS="1"
INCLUDE_PRINTING="1"

# ---- boot splash ----------------------------------------------------------
# Which backend draws the splash. Plymouth is INSTALLED AND IN THE INITRD in every mode —
# "off" here is the cmdline condition plymouth-start.service already ships
# (ConditionKernelCommandLine=!plymouth.enable=0), not a different image. So switching is a
# one-token change to the UKI cmdline and nothing has to be rebuilt but stages 40-60.
#
#   plymouth  splash drawn by plymouthd on DRM, from initrd through to the Plasma Login
#             Manager hand-off
#   stub      splash drawn ONCE by systemd-stub before the kernel starts; plymouth disabled
#   both      stub image first, plymouthd takes over when a DRM device appears
#   none      neither; bare console (useful as the control when comparing the other three)
#
# NB on "stub": systemd-stub fills the screen black and blits the bitmap 1:1 CENTRED, with no
# scaling (src/boot/splash.c), and it is drawn before the kernel — so it survives only until
# the first DRM driver modesets, which on this image is early. It covers the window plymouth
# cannot reach, not the long one plymouth exists for. See plan/04.
SPLASH_BACKEND="both"          # plymouth | stub | both | none
# Effective scale of the stub bitmap, same units as the theme's own `scale` (1 = the 1920x1080
# design baseline). Because the stub does not scale the image, this has to be chosen for the
# target panel: 1 for 1080p, 2 for 4K. Ignored unless SPLASH_BACKEND includes the stub.
SPLASH_STUB_SCALE="1"

# ---- initrd failure policy -------------------------------------------------
# 0: the UKI cmdline carries "rd.shell=0 rd.emergency=reboot", so an initrd that cannot find or
#    mount the root filesystem REBOOTS instead of dropping to a dracut shell. That is what makes
#    the A/B rollback in plan/01 automatic: systemd-boot decrements the entry's tries counter
#    when it boots it, but a machine sitting at an emergency prompt never finishes the attempt,
#    so a bad slot needed three manual power cycles to fall back. Rebooting spends the three
#    tries by itself, in seconds.
# 1: dev builds — keep the emergency shell. Worth knowing before you need it: loader.conf sets
#    "editor no" (stage 60) and the cmdline lives inside the signed-shaped UKI, so there is no
#    way to ask for the shell at boot time on an image built with 0. It is a rebuild of stages
#    40-60, not a boot-time choice.
DEBUG_INITRD="0"

# ---- flatpak ---------------------------------------------------------------
FLATPAK_PREINSTALL="org.mozilla.firefox org.kde.ark org.kde.kate org.kde.okular org.kde.gwenview"   # space-separated app IDs, each verified live on Flathub
FLATPAK_PREINSTALL_MODE="build"            # build: install into image; firstboot: oneshot unit

# ---- containers / distrobox ------------------------------------------------
# The mutable-userland escape hatch (plan/13). Flatpak packages application windows; it has no
# answer for "I need a package manager and a compiler". Distrobox runs a full mutable distro in
# a ROOTLESS podman container with $HOME, the Wayland socket, DBus and devices bound through, so
# the toolchain lives in /var — never on the read-only root. 0 drops podman, distrobox and their
# ~16-package tail from the image.
INCLUDE_DISTROBOX="1"
# What `distrobox create` uses when the user names no image. Deliberately FULLY QUALIFIED: an
# unqualified name would be resolved through containers-common's unqualified-search-registries,
# which is a registry-order heuristic this image should not depend on. Overridable per user in
# ~/.config/distrobox/distrobox.conf, and system-wide in /etc/distrobox/distrobox.conf (the /etc
# overlay makes that writable at runtime).
DISTROBOX_DEFAULT_IMAGE="docker.io/library/debian:stable"
