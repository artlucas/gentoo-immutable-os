# build.conf — single source of truth for the build. Sourced by bash (key="value" only,
# no logic). Validated by validate_config() in scripts/lib/common.sh.

# ---- identity -------------------------------------------------------------
DISTRO_ID="immos"                 # [a-z][a-z0-9-]*; used in partlabels, UKI names, unit names
DISTRO_NAME="Immutable OS"
VERSION="0.3.0"                     # X.Y.Z, strictly increasing across releases (strverscmp)
HOME_URL="https://immos.trinora.software"
# What the installer's two connectivity probes hit: the greeting page's requirements check and
# the appsetup job's own re-ask. Deliberately NOT HOME_URL — that is os-release/branding metadata
# for the product's own site, and the site did not exist when this knob was added (the domain is
# NXDOMAIN), so a probe against it read as "no internet" on every machine that HAD internet:
# the greeting always said offline and the apps page always forced "None extra". Point this at
# the product site when the product site is real.
INTERNET_CHECK_URL="https://www.gentoo.org"

# ---- updates --------------------------------------------------------------
UPDATE_CHANNEL="stable"
UPDATE_URL="https://immos.trinora.software/updates/stable"
UPDATE_VERIFY="0"                   # 1: require GPG-signed SHA256SUMS (needs config/keys/import-pubring.gpg)
                                    # 0: dev builds, transfers rendered with Verify=no

# ---- build inputs (pins) --------------------------------------------------
BUILDER_IMAGE="gentoo/stage3:amd64-systemd"
# A hard requirement, not advice: build.sh dies on an empty digest unless ALLOW_UNPINNED=1, and
# stage 80 refuses to assemble a release from a build that took the escape. A floating tag means
# the libc, compiler and profile the image is built against move under you with no diff anywhere.
BUILDER_DIGEST="sha256:689a1cfdfeceda1fb19c6cb057de04abfad43289278a9deb47eed0afaaa75872"

# The ebuild repo, pinned to a dated rsync snapshot and to its exact bytes.
#
# This was briefly pinned by commit in github.com/gentoo-mirror/gentoo, which is a better SHAPE
# of pin — permanent and content-addressed — and does not work: that mirror is the DEVELOPMENT
# repo with metadata/md5-cache grafted on, so its Manifests carry only DIST entries while its
# layout.conf declares "thin-manifests = false". Portage then verifies ebuilds it cannot find
# listed and refuses to merge ("A file is not listed in the Manifest"). The rsync snapshots
# below are full-Manifest trees, which is what portage actually requires.
#
# The nine-day retention on distfiles.gentoo.org is the known cost, and it is what stage 90's
# archive exists to absorb: once a release is vendored, the tree travels with it and upstream
# retention stops mattering. Capture a new pin while it is still live.
SNAPSHOT_DATE="20260820"
# Of gentoo-<SNAPSHOT_DATE>.tar.xz. emerge-webrsync already verifies upstream's own digest and
# GPG signature; this pins the bytes against upstream republishing the file under the same name,
# and is what makes a vendored copy verifiable years later.
SNAPSHOT_SHA256="c61294000825031e58a38f60fadb603423c61430b841d73b87705f789d83944b"
PROFILE="default/linux/amd64/23.0/desktop/plasma/systemd"
# BUILDER-ONLY binhost: the builder installs its own tools (qemu, dracut, rsvg-convert, ...)
# as binary packages from here. The image does NOT use it — everything that ships is
# compiled by this pipeline or reused from its own /cache/binpkgs builds. See the NB in
# config/portage/make.conf.in for why, and builder/Dockerfile for the builder side.
BINHOST_URI="https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/"

# ---- image geometry (MiB) -------------------------------------------------
ESP_SIZE_MIB="1024"
ROOT_SLOT_SIZE_MIB="6144"
VAR_SIZE_MIB="4096"
EROFS_COMPRESSION="lz4hc,12"        # or: zstd,15

# The smallest disk the installer will install onto, in GB — DECIMAL, because that is the unit
# printed on the box and the unit both installer pages now say out loud (plan/24 §3).
#
# ONE NUMBER, TWO CONSUMERS, and they used to be one number written twice in two different units:
# the greeting page's `requiredStorage`, which decides whether Next may be pressed at all, and the
# disk page's `minimumDiskSize`, which decides which rows in the picker are selectable. A machine
# that passed the first and failed the second would be an installer that says yes and then offers
# nothing to install onto.
#
# 32 GB decimal is 29.8 GiB, which is slightly LESS than the 32 GiB this used to ask for. The
# layout is what it has to cover: a 1 GiB ESP, two 6 GiB root slots — the second one is not
# optional, it is the half of the A/B pair systemd-sysupdate writes into — and a /var big enough
# for the seeded Flatpak store and a home directory. At 32 GB that leaves ~17 GiB of /var.
MIN_INSTALL_DISK_GB="32"

# ---- live user (v1 images double as live media; installer replaces this) --
LIVE_USER="live"
LIVE_USER_PASSWORD="live"

# ---- locales / fonts / options --------------------------------------------
# LOCALE_GEN and LOCALES_KEEP ARE NOT SET HERE ANY MORE. They are derived, by load_config(), from
# config/languages.conf — one table naming the languages this distro actually speaks (plan/22 §2b).
#
# They were two independent strings for as long as this file had them, and nothing compared them:
# LOCALE_GEN said en_US.UTF-8 while LOCALES_KEEP said nine languages, so the product carried nine
# translated desktops and could load one locale. Anything but English got LANG=en_US.UTF-8 and a
# warning in a log nobody reads. Deriving both from one row per language is what makes that
# disagreement unrepresentable rather than merely fixed.
#
# Set them here again and load_config() will leave them alone — the derivation is `:` defaulted,
# so a build that deliberately wants a locale with no installer translation can still say so. It
# should be a considered thing to do, which is why it is not the default shape of this file.
INCLUDE_CJK_FONTS="1"
INCLUDE_PRINTING="1"

# ---- boot splash ----------------------------------------------------------
# Which of the splash's two halves the image gets. They cover different windows of the boot and
# neither can cover the other's, because this kernel has no simpledrm: nothing can draw between
# the firmware and the first real KMS driver except the EFI stub, and nothing can draw after the
# first modeset except a DRM client. See plan/14.
#
#   both      the whole timeline: the stub bitmap from the firmware through the initrd, then the
#             KMS splash from the first modeset to the greeter. The two are the same still image
#             at the same brightness, so the hand-off is invisible
#   stub      the systemd-stub bitmap alone; black from the first modeset to the greeter, which
#             is most of the boot. Useful as a control, not as a configuration
#   kms       no pre-kernel image; splash from the first modeset onward. The firmware logo stays
#             up until the modeset instead
#   none      neither; bare console (the control when comparing the other three)
#
# NOTHING about the image changes with this except at most one cmdline token. The splash binary,
# its assets, its unit and its udev rule are installed in all four modes — "off" is the single
# condition the unit itself carries (ConditionKernelCommandLine=!<id>.splash=0), exactly as
# plymouth's own unit used plymouth.enable=0 before it. So switching is a rerun of stages 40-60
# and nothing has to be rebuilt.
SPLASH_BACKEND="kms"           # both | stub | kms | none
# Effective scale of the STUB bitmap only, at the 1920x1080 design baseline (1 = 1080p, 2 = 4K).
# It needs a knob because systemd-stub runs before ExitBootServices, blits the bitmap 1:1 CENTRED
# with no scaling, and has no resolution to ask about at build time (src/boot/splash.c). The KMS
# half needs no equivalent: it reads the mode off the CRTC and picks its own sprite scale.
# Ignored unless SPLASH_BACKEND includes the stub.
SPLASH_STUB_SCALE="1"

# ---- initrd failure policy -------------------------------------------------
# 0: the UKI cmdline carries "rd.shell=0 rd.emergency=reboot", so an initrd that cannot find or
#    mount the root filesystem REBOOTS instead of dropping to a dracut shell. That is what makes
#    the A/B rollback in plan/01 automatic: systemd-boot decrements the entry's tries counter
#    when it boots it, but a machine sitting at an emergency prompt never finishes the attempt,
#    so a bad slot needed three manual power cycles to fall back. Rebooting spends the three
#    tries by itself, in seconds.
# 1: dev builds — keep the emergency shell. Worth knowing before you need it: loader.conf sets
#    "editor no" (stage 60) and the cmdline lives inside the signed-shaped UKI, so there is no
#    way to ask for the shell at boot time on an image built with 0. It is a rebuild of stages
#    40-60, not a boot-time choice.
DEBUG_INITRD="0"

# ---- flatpak ---------------------------------------------------------------
# Which apps. WHICH VERSIONS lives in config/flatpak/apps.lock, which pins every ref — apps and
# runtimes both — to an exact Flathub commit (plan/15). Adding an app here and rebuilding will
# fail stage 40's readback until the lock is regenerated:  scripts/relock.sh --flatpak
FLATPAK_PREINSTALL="org.mozilla.firefox org.kde.ark org.kde.kwrite org.kde.okular org.kde.gwenview"   # space-separated app IDs, each verified live on Flathub
# build:     installed into the image, and therefore pinnable by apps.lock.
# firstboot: installed on the device by a oneshot unit, months later — NOT pinnable by
#            construction, whatever apps.lock says.
FLATPAK_PREINSTALL_MODE="build"            # build: install into image; firstboot: oneshot unit

# ---- containers / distrobox ------------------------------------------------
# The mutable-userland escape hatch (plan/13). Flatpak packages application windows; it has no
# answer for "I need a package manager and a compiler". Distrobox runs a full mutable distro in
# a ROOTLESS podman container with $HOME, the Wayland socket, DBus and devices bound through, so
# the toolchain lives in /var — never on the read-only root. 0 drops podman, distrobox and their
# ~16-package tail from the image.
INCLUDE_DISTROBOX="1"
# What `distrobox create` uses when the user names no image. Deliberately FULLY QUALIFIED: an
# unqualified name would be resolved through containers-common's unqualified-search-registries,
# which is a registry-order heuristic this image should not depend on. Overridable per user in
# ~/.config/distrobox/distrobox.conf, and system-wide in /etc/distrobox/distrobox.conf (the /etc
# overlay makes that writable at runtime).
DISTROBOX_DEFAULT_IMAGE="docker.io/library/debian:stable"

# ---- installer payload (plan/16 §5.1) ---------------------------------------------------
# What the `installer` profile's live medium carries and writes to the target disk. Installing
# this distro is not unpack-and-configure: it is `dd`, so the payload is three artifacts the
# DESKTOP profile already produced — its root EROFS, its UKI, and a tarball of its /var — staged
# into the live image's own /var by stage 40.
#
# 1: the var-template includes the preinstalled Flatpaks, so an installed machine has its apps
#    with no network at all. That is the point of stage 90 restated for the installer, and it is
#    the default for the same reason: a release must stay usable offline. It costs ~2 GiB on the
#    stick, which is what pushes the installer image past a 16 GB one.
# 0: the var-template carries the overlay skeleton and homes only. The installed system boots
#    fine and has no Flatpaks until someone installs them. Worth it for a small stick, and
#    nothing else changes.
#
# Ignored by every profile except `installer` — nothing else stages a payload.
INSTALLER_PAYLOAD_FLATPAKS="1"

# ---- managed mode (plan/19) --------------------------------------------------------------
# The hosted control plane a device enrols with. A BUILD KNOB, never a hardcoded string, for the
# same reason DISTRO_ID is one (plan/00, "Identity & naming") — and because a self-hosted or
# staging control plane has to be reachable without rebuilding the client. `<id>-managed enroll
# --api URL` overrides it per device; this is only the default.
#
# HTTPS is not a preference. The client refuses any other scheme, because TLS is what
# authenticates the host before the bundle's own signature authenticates its author (§5.1, §5.8).
MANAGED_API_BASE="https://managed.immos.trinora.software"

# The public half of the key that signs policy bundles, ASCII-armoured, baked into the image at
# /usr/lib/<id>/managed-pubring.gpg as the trust anchor. A key fetched at enrolment time is not a
# trust anchor (plan/19 §5.7).
#
# ARMOURED IN THE REPO, BINARY IN THE IMAGE, and the conversion is stage 40's. gpgv wants a
# binary keyring; a repo wants a file that diffs, that survives a checkout on Windows, and that
# the suite's CRLF check can read — and a binary .gpg satisfies none of those. `gpg --dearmor`
# is one line and removes the whole question.
#
# SEPARATE FROM THE RELEASE KEY (config/keys/import-pubring.gpg), deliberately: they have
# different lifetimes and very different exposure. The release key signs a handful of artifacts
# from an offline machine; the service key signs every bundle for every org, continuously, on a
# host that is on the internet.
#
# THE DEFAULT POINTS INTO tests/ AND THAT IS THE HONEST PLACE FOR IT. config/keys/ is
# .gitignored — real keys are supplied by whoever builds a release, never committed, exactly as
# the release key is — so a default naming a file there would break every fresh clone's build on
# a file nobody could have. The value below is a THROWAWAY key whose private half is committed
# beside it, so that `build.sh --with-test-api` works out of the box and the stage-70 fixture can
# sign bundles a built image actually accepts.
#
# An image built against it will take policy from anyone who has read this repository. Stage 40
# warns, loudly, on exactly that. For a real deployment: generate a key, put the public half at
# config/keys/managed-pubring.asc, and point this there.
#
# There is deliberately no MANAGED_VERIFY=0 to match UPDATE_VERIFY: plan/19 §5.8 rule 1 is "never
# send unsigned policy", with no trusted-transport exception, and a switch that turned bundle
# verification off would eventually ship enabled. A build with no key at all is not the escape
# hatch either — it simply has no trust anchor, so managed mode refuses every bundle, which is
# the safe failure rather than a permissive one.
MANAGED_PUBRING="tests/managed-api/keys/pubring.asc"
