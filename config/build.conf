# build.conf — single source of truth for the build. Sourced by bash (key="value" only,
# no logic). Validated by validate_config() in scripts/lib/common.sh.

# ---- identity -------------------------------------------------------------
DISTRO_ID="immos"                 # [a-z][a-z0-9-]*; used in partlabels, UKI names, unit names
DISTRO_NAME="Immutable OS"
VERSION="0.1.0"                     # X.Y.Z, strictly increasing across releases (strverscmp)
HOME_URL="https://example.invalid/immos"

# ---- updates --------------------------------------------------------------
UPDATE_CHANNEL="stable"
UPDATE_URL="https://updates.example.invalid/immos/stable"
UPDATE_VERIFY="1"                   # 1: require GPG-signed SHA256SUMS (needs config/keys/import-pubring.gpg)
                                    # 0: dev builds, transfers rendered with Verify=no

# ---- build inputs (pins) --------------------------------------------------
BUILDER_IMAGE="gentoo/stage3:amd64-systemd"
BUILDER_DIGEST=""                   # sha256:… to pin; empty tolerated only for dev builds
SNAPSHOT_DATE="20260819"           # gentoo ebuild repo snapshot (YYYYMMDD)
                                    # NB: distfiles.gentoo.org keeps only ~9 days of
                                    # snapshots; an older pin 404s and stage 10 fails.
PROFILE="default/linux/amd64/23.0/desktop/gnome/systemd"
BINHOST_URI="https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/"

# ---- image geometry (MiB) -------------------------------------------------
ESP_SIZE_MIB="1024"
ROOT_SLOT_SIZE_MIB="6144"
VAR_SIZE_MIB="4096"
EROFS_COMPRESSION="lz4hc,12"        # or: zstd,15

# ---- live user (v1 images double as live media; installer replaces this) --
LIVE_USER="live"
LIVE_USER_PASSWORD="live"

# ---- locales / fonts / options --------------------------------------------
LOCALE_GEN="en_US.UTF-8 UTF-8"      # /etc/locale.gen lines, ';'-separated for multiple
LOCALES_KEEP="en de fr es pt_BR it ja zh_CN ru"   # message catalogs kept by prune
INCLUDE_CJK_FONTS="1"
INCLUDE_PRINTING="1"

# ---- flatpak ---------------------------------------------------------------
FLATPAK_PREINSTALL="org.mozilla.firefox"   # space-separated app IDs
FLATPAK_PREINSTALL_MODE="build"            # build: install into image; firstboot: oneshot unit
