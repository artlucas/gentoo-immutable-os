# apps.lock — the preinstalled Flatpaks, pinned to exact Flathub commits (plan/15 layer 5).
# GENERATED by scripts/relock.sh --flatpak — do not hand-edit.
#
# One "<ref> <commit>" per line. RUNTIMES ARE LISTED TOO, and they are the point: the five app
# refs are a few hundred MiB, while org.freedesktop.Platform, org.kde.Platform and the .Locale
# extensions are most of the 2.7 GiB /var/lib/flatpak this image ships. Pinning the apps and
# letting the runtimes float would leave nearly all of the bytes unpinned.
#
# Stage 40 installs, then deploys each locked commit with `flatpak update --commit=`, then reads
# back `flatpak list --columns=ref,active` and asserts. The readback is not decoration: a
# --commit that silently no-ops looks exactly like success.
#
# FLATPAK_PREINSTALL_MODE="firstboot" cannot be pinned by construction — the install happens on
# the device, months later. This lock applies to the "build" mode only.
#
# Flathub garbage-collects old commits on its own schedule, which is shorter and less documented
# than Gentoo's ebuild retention. This is the least durable pin in the build; stage 90's archive
# is what makes an old release still rebuildable after Flathub has moved on.
