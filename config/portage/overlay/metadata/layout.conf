# The in-repo ebuild repository (plan/19 Phase D). See ../README.md.

# Everything in the Gentoo tree is visible here — eclasses, licences, categories, virtuals — and
# an ebuild here with a name the tree also carries SHADOWS it. That is a sharp edge; the README
# says why this repository must never be used that way.
masters = gentoo

# THIN, and there is nothing to thin: a thin Manifest records only DIST entries, and no ebuild
# here has a SRC_URI — the sources live in files/, inside the repository. So no Manifest file is
# needed at all, and `ebuild ... digest` is not part of anyone's workflow.
thin-manifests = true
sign-manifests = false
manifest-hashes = BLAKE2B SHA512
manifest-required-hashes = BLAKE2B

# portage-2 for the profile directory format; md5-dict so portage can cache metadata for these
# ebuilds the same way it does for the tree's.
profile-formats = portage-2
cache-formats = md5-dict
