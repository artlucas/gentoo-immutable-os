# The packaged fallback for the disk page (plan/24).
#
# THE MEDIUM DOES NOT READ THIS FILE. Stage 40 renders config/calamares/modules/disk.conf.in into
# /etc/calamares/modules/disk.conf, which Calamares searches first (modulesystem/Module.cpp), and
# that copy has the build's own numbers in it. This one exists so the module is loadable on its
# own — see the note about INSTALL_CONFIG in CMakeLists.txt — and its values are deliberately the
# same ones config/build.conf ships, so a module loaded without the rendered file behaves rather
# than refusing.
---
# Decimal GB, the unit the page speaks (plan/24 §3). The rendered copy gets build.conf's
# MIN_INSTALL_DISK_GB, which is also what the greeting page's requiredStorage is rendered from.
minimumDiskSize:  32

# What the page draws in the bar, and what the `disksetup` job actually creates. Both are MiB and
# both come from build.conf — ESP_SIZE_MIB and ROOT_SLOT_SIZE_MIB — because the picture the user
# is shown and the partitions the job writes have to be the same layout.
espSizeMiB:       1024
rootSlotSizeMiB:  6144
