# The packaged fallback for /etc/calamares/modules/keymap.conf. The medium always gets the
# RENDERED copy; this exists so the module is loadable on its own, and so that a missing default
# is `us` — what the image ships as KEYMAP in /etc/vconsole.conf — rather than an empty layout
# the page cannot draw a preview for.
---
layout:     "us"
variant:    ""
