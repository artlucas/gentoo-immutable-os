#
# The PACKAGED FALLBACK for the language module. The install medium never reads this file: stage 40
# renders /etc/calamares/modules/language.conf out of config/languages.conf, and /etc is the first
# path Calamares searches (modulesystem/Module.cpp).
#
# It exists so the module is loadable on its own — a plugin whose only configuration is one an
# unrelated build stage writes cannot be started, tested or debugged outside a full build. See the
# INSTALL_CONFIG note in CMakeLists.txt for why it takes a line of CMake to get installed at all.
#
# IT CONFIGURES ONE THING, because the page asks one question. The `requirements:` block that used
# to sit below the list is greeting.conf's since plan/23, in the module that runs those checks.
#
# ITS LIST IS ENGLISH AND NOTHING ELSE, ON PURPOSE. A fallback that guessed at nine languages would
# be a second source of truth for the one thing config/languages.conf was created to make single,
# and the two would drift the first time somebody added a row to only one of them.
---
languages:
    - id:       en
      locale:   en_US.UTF-8
      label:    "English"
      english:  "English"
