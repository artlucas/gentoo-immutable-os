# Configuration for the managed-enrolment view module (plan/19 §7.3).
#
# Installed to /usr/share/calamares/modules/managed.conf by calamares_add_plugin, and overridden
# by /etc/calamares/modules/managed.conf, which is the path this project's stage 40 writes and
# the first one Calamares searches.
---
# Shown on the page under the code field. A shop imaging six machines puts its own name here so
# the person in front of the screen recognises what they are being asked to join. Empty by
# default: a household enrolling one laptop has nothing to say here.
organisationHint: ""
