# The packaged fallback for /etc/calamares/modules/location.conf. The medium always gets the
# RENDERED copy; this exists so the module is loadable on its own, and so that a missing default
# is Etc/UTC — what the image ships — rather than an empty region the page cannot draw.
---
region:     "Etc"
zone:       "UTC"
# ...and the same argument one line down: a module loaded without the medium's rendered
# configuration should behave the way the image behaves, and systemd-timesyncd is enabled in
# this image's vendor preset.
networkTime: true
