# The accounts page (plan/21).
#
# THIS COPY IS THE FALLBACK, not the one the medium uses. calamares_add_plugin installs it to
# /usr/share/calamares/modules/accounts.conf, and /etc/calamares/modules is searched first
# (modulesystem/Module.cpp) — so the file stage 40 renders from
# config/calamares/modules/accounts.conf.in wins, and that is where the real values and the
# reasoning behind them live. What is here is only enough for the module to be loadable and
# testable on its own.
---
modes: [ local, managed, domain ]

# system: true is inert (nothing here creates a group — see the rendered conf), and kept because
# this is the stock schema.
defaultGroups:
    - name: wheel
      must_exist: true
      system: true
    - name: video
      must_exist: true
      system: true

passwordRequirements:
    minLength: 8
    libpwquality:
        - minlen=8
        - minclass=2
    allowWeakPasswords: true

user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    forbidden_names: [ localhost ]

organisationHint: ""
failsafeUserName: admin
