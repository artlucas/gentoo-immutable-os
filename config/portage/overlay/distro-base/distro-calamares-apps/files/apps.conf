#
# The packaged fallback for the applications page (plan/25). The medium reads the copy rendered
# into /etc/calamares/modules/apps.conf; this one exists so the module is loadable on its own, and
# tests/test-installer.sh asserts the two agree app for app.
---
# The same `included:` list the rendered copy carries (plan/30 §5) — what the image already ships,
# shown read-only on the page. tests/test-installer.sh asserts the two files agree entry for
# entry, here as for `apps:`, because the medium reads the /etc copy and nothing would ever notice
# this one going stale.
included:
    - id: org.mozilla.firefox
      name: Firefox
      description: Browse the web
      icon: internet-web-browser
    - id: org.kde.dolphin
      name: Dolphin
      description: Browse and manage your files
      icon: system-file-manager
    - id: org.kde.konsole
      name: Konsole
      description: A terminal
      icon: utilities-terminal
    - id: org.kde.okular
      name: Okular
      description: Read PDFs and other documents
      icon: application-pdf
    - id: org.kde.gwenview
      name: Gwenview
      description: View and sort your photographs
      icon: image-x-generic
    - id: org.kde.kwrite
      name: KWrite
      description: A plain text editor
      icon: accessories-text-editor
    - id: org.kde.ark
      name: Ark
      description: Open and create archives
      icon: application-x-archive
    - id: org.kde.spectacle
      name: Spectacle
      description: Take screenshots
      icon: camera-photo

defaultMode: typical
apps:
    - id: org.mozilla.Thunderbird
      name: Thunderbird
      description: Email, calendars and chat from Mozilla
      icon: internet-mail
    - id: org.videolan.VLC
      name: VLC
      description: Plays nearly every audio and video format
      icon: video-x-generic
    - id: org.libreoffice.LibreOffice
      name: LibreOffice
      description: Word processor, spreadsheet and presentations
      icon: x-office-document
    - id: org.kde.krita
      name: Krita
      description: Digital painting and illustration
      icon: applications-graphics
    - id: org.kde.krdc
      name: KRDC
      description: View and control a remote desktop
      icon: preferences-desktop-remote
    - id: org.kde.kate
      name: Kate
      description: A powerful text editor by KDE
      icon: accessories-text-editor
