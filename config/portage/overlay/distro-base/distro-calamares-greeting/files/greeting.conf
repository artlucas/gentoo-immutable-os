#
# The PACKAGED FALLBACK for the greeting module. The install medium never reads this file: stage 40
# renders /etc/calamares/modules/greeting.conf from config/calamares/modules/greeting.conf.in, and
# /etc is the first path Calamares searches (modulesystem/Module.cpp).
#
# It exists so the module is loadable on its own — a plugin whose only configuration is one an
# unrelated build stage writes cannot be started, tested or debugged outside a full build. See the
# INSTALL_CONFIG note in CMakeLists.txt for why it takes a line of CMake to get installed at all.
#
# The numbers below are the rendered file's, copied rather than guessed at: a fallback that invented
# a smaller requiredStorage would be a second source of truth for the one number this page exists to
# enforce.
---
requirements:
    requiredStorage:    32.0
    requiredRam:        4.0
    internetCheckUrl:   "https://example.com"
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root
