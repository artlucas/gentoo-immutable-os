# Keyboard layout (plan/16 §5.3, "Keep").
#
# Writes /etc/vconsole.conf (KEYMAP=) and /etc/X11/xorg.conf.d/00-keyboard.conf in the target.
# Both are writes into /etc and therefore into the overlay upper on /var; the image ships
# KEYMAP=us in the lower and the upper's copy wins.
#
# xorg.conf.d on a Wayland-only image is not the dead end it looks like: systemd-localed reads
# and writes exactly that file as the system's X11 keyboard configuration, and kwin_wayland
# started with --locale1 takes its layout from localed. That is the path this image is on, which
# is why `configure.kwin` below stays false — it is the alternative to locale1, not an addition
# to it, and turning both on means two writers for one setting.
---
xOrgConfFileName:    "/etc/X11/xorg.conf.d/00-keyboard.conf"
# EMPTY on purpose, which upstream's own comment offers as the answer for distributions where
# the setting does not apply: it names a directory of X11->kbd converted keymaps
# (/lib/kbd/keymaps/xkb), shipped by sys-apps/kbd, which is not in this image's package set.
# Pointed at a directory that does not exist, findConvertedKeymap() returns nothing and the job
# falls through to findLegacyKeymap(), which reads a kbd-model-map compiled into Calamares' own
# QRC and needs no files on disk at all. That is the path we want; saying so is better than
# naming a path and relying on it being absent.
convertedKeymapPath: ""
configure:
    kwin:  false
    gnome: false
