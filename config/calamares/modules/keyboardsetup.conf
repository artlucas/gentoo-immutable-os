# The keyboard layout, written into the installed system (plan/28 §6).
#
# NO KEYS, for the reason localesetup.conf gives. The job's input is GlobalStorage —
# `keyboardLayout` and `keyboardVariant`, published by the `keymap` page — and its one lookup
# table is the TARGET's own /usr/share/systemd/kbd-model-map, which is the same file
# systemd-localed reads on the installed machine.
#
# `convertedKeymapPath` is gone with the stock module that had it: upstream needed it because its
# job looked for X11->kbd converted keymaps before falling back to a table compiled into
# Calamares' binary, and there is no fallback path here to configure.
---
