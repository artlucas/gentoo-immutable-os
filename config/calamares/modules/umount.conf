# Unmount the target (plan/16 §5.3, "Keep").
#
# Reads GS rootMountPoint — which imagedeploy set — reads /etc/mtab for everything under it, and
# unmounts each with `umount -lv` before unmounting the root itself.
#
# The lazy flag is what makes this safe for the stack imagedeploy builds. Ordering matters here
# in principle: /etc is an overlay whose upperdir and workdir live on /var, so a strict unmount
# would have to take /etc before /var. `-l` detaches immediately and lets the kernel finish the
# teardown when the last reference goes, so the order the module happens to pick cannot fail.
# imagedeploy syncs before it returns, so nothing is waiting on writeback either.
#
# emergency: true — it runs even when an earlier job failed. A failed install that leaves the
# target mounted is a machine the user cannot retry on without rebooting.
---
emergency: true
