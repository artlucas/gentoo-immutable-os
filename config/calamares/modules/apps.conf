# The applications page (plan/25).
#
# This file is NOT a .in template, like locale.conf and keyboard.conf: there is no build-time
# token in it. The app list is facts about Flathub, not about this build, and giving it a token
# would be a way for a rebrand to change which apps the installer offers without anything
# noticing. It is copied verbatim by stage 40 into /etc/calamares/modules/apps.conf, which is the
# first path Calamares searches; the packaged fallback inside the module's ebuild carries the same
# list so the plugin is loadable on its own, and tests/test-installer.sh asserts the two agree
# app for app.
#
# WHAT THIS LIST IS NOT: it is not FLATPAK_PREINSTALL and not apps.lock. Those are the
# applications that travel INSIDE the payload and land on the machine with no network at all;
# this is the list the installer OFFERS to download from Flathub while it runs, which is why
# none of them are pinned — there is no commit to pin an install that has not happened yet, and
# offline the page forces "Nothing extra" rather than pretending otherwise (plan/25).
#
# `id` is the flatpak ref the `appsetup` job installs, unqualified and resolved against the
# `remote:` in modules/appsetup.conf. `name` is a proper noun and deliberately not translated.
# `icon` is a freedesktop name from the Breeze set the medium already ships.
---
# typical | none. NOT custom: a page that opens on a half-ticked list is asking the user to audit
# six checkboxes before they can trust the one they want. The set (or its absence) is the
# distro's answer; the list is for crossing things off it.
defaultMode: typical
apps:
    - id: org.mozilla.Thunderbird
      name: Thunderbird
      icon: internet-mail
    - id: org.videolan.VLC
      name: VLC
      icon: video-x-generic
    - id: org.libreoffice.LibreOffice
      name: LibreOffice
      icon: x-office-document
    - id: org.kde.krita
      name: Krita
      icon: applications-graphics
    - id: org.kde.krdc
      name: KRDC
      icon: preferences-desktop-remote
    - id: org.kde.kate
      name: Kate
      icon: accessories-text-editor
