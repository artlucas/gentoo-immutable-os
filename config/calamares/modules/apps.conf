# The applications page (plan/25).
#
# This file is NOT a .in template, like locale.conf and keyboard.conf: there is no build-time
# token in it. The app list is facts about Flathub, not about this build, and giving it a token
# would be a way for a rebrand to change which apps the installer offers without anything
# noticing. It is copied verbatim by stage 40 into /etc/calamares/modules/apps.conf, which is the
# first path Calamares searches; the packaged fallback inside the module's ebuild carries the same
# list so the plugin is loadable on its own, and tests/test-installer.sh asserts the two agree
# app for app.
#
# WHAT THIS LIST IS NOT: it is not FLATPAK_PREINSTALL and not apps.lock. Those are the
# applications that travel INSIDE the payload and land on the machine with no network at all;
# this is the list the installer OFFERS to download from Flathub while it runs, which is why
# none of them are pinned — there is no commit to pin an install that has not happened yet, and
# offline the page forces "Nothing extra" rather than pretending otherwise (plan/25).
#
# `id` is the flatpak ref the `appsetup` job installs, unqualified and resolved against the
# `remote:` in modules/appsetup.conf. `name` is a proper noun and deliberately not translated.
# `icon` is a freedesktop name from the Breeze set the medium already ships. `description` is the
# one line under the name in the custom list — a sentence, so unlike the name it IS translated:
# its English text here is the lookup key into the AppsDescriptions context of the branding
# catalogue (the language page's LanguageNames bargain), and editing one without editing the .ts
# falls back to this English (plan/27 §2).
---
# WHAT THE IMAGE ALREADY CARRIES (plan/30 §5). Read-only on the page, under its own eyebrow: the
# page offered six applications and said nothing about the eight already on the disk, so "Nothing
# extra" read as "nothing" on a machine that is about to arrive with a browser, an archiver, a
# text editor, a document viewer, an image viewer, a file manager, a terminal and a screenshot
# tool on it. Nobody should have to install Firefox twice to find that out.
#
# A LIST HERE RATHER THAN A STRING IN C++, because the page already reads its other list from
# this file and the two have to be edited together — an application that moves from `included:`
# to `apps:` is one edit in one place.
#
# IT MUST NOT DRIFT FROM THE BUILD, which is the risk a hand-kept list carries: the five Flatpaks
# below are build.conf's FLATPAK_PREINSTALL and the three natives are config/portage/sets/desktop,
# and nothing here is derived from either. tests/test-installer.sh asserts that every id in
# FLATPAK_PREINSTALL appears below, and that no id appears in both lists. It is deliberately
# ONE-DIRECTIONAL: the natives are not in FLATPAK_PREINSTALL and never will be.
#
# `id` is the Flathub ref for the Flatpaks and the desktop-file id for the natives. Nothing
# installs from these — the id is here so the test above can compare it against FLATPAK_PREINSTALL,
# and so that a reader can tell which of two similarly named things is meant. `description` is
# translated through AppsDescriptions exactly as the offered list's is.
included:
    - id: org.mozilla.firefox
      name: Firefox
      description: Browse the web
      icon: internet-web-browser
    - id: org.kde.dolphin
      name: Dolphin
      description: Browse and manage your files
      icon: system-file-manager
    - id: org.kde.konsole
      name: Konsole
      description: A terminal
      icon: utilities-terminal
    - id: org.kde.okular
      name: Okular
      description: Read PDFs and other documents
      icon: application-pdf
    - id: org.kde.gwenview
      name: Gwenview
      description: View and sort your photographs
      icon: image-x-generic
    - id: org.kde.kwrite
      name: KWrite
      description: A plain text editor
      icon: accessories-text-editor
    - id: org.kde.ark
      name: Ark
      description: Open and create archives
      icon: application-x-archive
    - id: org.kde.spectacle
      name: Spectacle
      description: Take screenshots
      icon: camera-photo

# typical | none. NOT custom: a page that opens on a half-ticked list is asking the user to audit
# six checkboxes before they can trust the one they want. The set (or its absence) is the
# distro's answer; the list is for crossing things off it.
defaultMode: typical
apps:
    - id: org.mozilla.Thunderbird
      name: Thunderbird
      description: Email, calendars and chat from Mozilla
      icon: internet-mail
    - id: org.videolan.VLC
      name: VLC
      description: Plays nearly every audio and video format
      icon: video-x-generic
    - id: org.libreoffice.LibreOffice
      name: LibreOffice
      description: Word processor, spreadsheet and presentations
      icon: x-office-document
    - id: org.kde.krita
      name: Krita
      description: Digital painting and illustration
      icon: applications-graphics
    - id: org.kde.krdc
      name: KRDC
      description: View and control a remote desktop
      icon: preferences-desktop-remote
    - id: org.kde.kate
      name: Kate
      description: A powerful text editor by KDE
      icon: accessories-text-editor
