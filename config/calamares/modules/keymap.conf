# Which keyboard this is (plan/28 §6).
#
# THE PAGE THIS CONFIGURES IS OURS, and the stock `keyboard` module is out of the sequence with
# it. What moved and what changed is in the module's own headers; the two things that belong in a
# configuration file are here.
#
# THE LAYOUT LIST comes from x11-misc/xkeyboard-config's own registry,
# /usr/share/X11/xkb/rules/evdev.xml, read at page load. There is no key to point it elsewhere,
# deliberately: a second rules file on this medium would be a second answer to "what layouts exist"
# and the compositor only reads one.
#
# THE KEY PREVIEW is libxkbcommon's answer for the selected layout, not a drawing. The page does
# NOT switch the live session's layout — the medium runs kwin_wayland with --locale1, so that
# would mean talking to systemd-localed over polkit — which is also why there is no "type here to
# test" box: it would be testing the layout the medium booted with.
#
# `convertedKeymapPath` is gone with the module that had it. Upstream needed it because its job
# looked for X11->kbd converted keymaps before falling back to a compiled-in table;
# `keyboardsetup` reads the TARGET's /usr/share/systemd/kbd-model-map instead — the same file
# systemd-localed consults on the installed machine — so there is no fallback path to configure.
#
# `configure.kwin` and `configure.gnome` are gone for the same reason, and the reasoning that put
# them at false is kept: systemd-localed reads and writes /etc/X11/xorg.conf.d/00-keyboard.conf as
# the system's X11 keyboard configuration, and kwin_wayland started with --locale1 takes its
# layout from localed. Writing kwin's own config as well would be two writers for one setting.
---
# The default pin before the user chooses. `us` is what the image ships as KEYMAP in
# /etc/vconsole.conf, so this is "unchanged" rather than a guess.
layout:     "us"
# The layout's plain form. A variant is only meaningful under the layout that offers it, so this
# is empty rather than naming one that would have to change whenever `layout` did.
variant:    ""
