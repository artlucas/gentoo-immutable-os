# The timezone symlink (plan/28 §6).
#
# NO KEYS, and the file exists for the reason every other job module's does: Calamares loads
# <name>.conf for a module whose descriptor does not say `noconfig`, and this repo's rule — which
# tests/test-installer.sh enforces — is that every module in the sequence has a rendered
# configuration, so that "what configures this?" is answered by a path rather than by reading a
# module.desc.
#
# The job's whole input is GlobalStorage: `locationRegion` and `locationZone`, published by the
# `location` page. Both are upstream's key names, because they are a published contract and not
# this installer's to rename.
#
# /etc/locale.conf is NOT written here. `imageidentity` writes it, and only for a locale the
# image actually compiled — see its write_locale(). A second writer would be exactly the failure
# that check exists to prevent.
---
