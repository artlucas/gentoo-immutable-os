# Timezone and locale (plan/16 §5.3, "Keep").
#
# This module's ONLY job is SetTimezoneJob, which rm's and re-symlinks /etc/localtime in the
# target (SetTimezoneJob.cpp). That is a write into /etc, and /etc in the target is an overlay
# whose upper lives on /var — so it lands in the upper and shadows the image's UTC symlink,
# with no patching. §5.2 is what makes that true.
#
# NB `localecfg`, the module that would normally follow this one, is deliberately NOT in the
# sequence. It rewrites the target's /etc/locale.gen and then runs `locale-gen` inside it, and
# this image HAS NO locale-gen: stage 40 drives glibc's localedef directly at build time,
# because locale-gen is a stage3 convenience that was never part of the package set. It would
# also be pointless — the compiled locale-archive lives in the read-only /usr, so there is
# nothing to regenerate on the target. /etc/locale.conf is written by imageidentity instead,
# which first checks that the chosen locale is one the image actually carries.
---
# The default pin before the user chooses. UTC is what the image ships (stage 40 symlinks
# /etc/localtime to it), so this is "unchanged" rather than a guess about where the user is.
region:     "Etc"
zone:       "UTC"

# WHERE THE `en_CA.UTF-8` CAME FROM, and how much of it this closes (plan/22 §6).
#
# loadLocales() in this module's Config.cpp reads /usr/share/i18n/SUPPORTED FIRST and only falls
# back to localeGenPath. Nothing pruned /usr/share/i18n, so that file was on the medium and this
# page's language dialog offered roughly five hundred locales — of which the machine being
# installed could load exactly one, because LOCALE_GEN said en_US.UTF-8 and nothing else. Picking
# any other one got a warning from `imageidentity` and LANG=en_US.UTF-8 anyway.
#
# THE LOAD-BEARING HALF IS THE DELETION, not this key: stage 50 removes
# /usr/share/i18n/SUPPORTED on the installer profile, and only then is localeGenPath consulted.
# The value below is Config.cpp:442's own default, named explicitly because a dependency on a
# default is a dependency nobody greps for — and because it is /etc/locale.gen that stage 40 writes
# out of config/languages.conf, which is the connection worth being able to find from this file.
# loadLocales() then strips the trailing " UTF-8" off each line, so `de_DE.UTF-8 UTF-8` arrives as
# `de_DE.UTF-8`: the nine locales the image actually compiled, every one of which the target can
# load and every one of which is a row on the language page before this one.
#
# NB nothing may write a COMMENT into /etc/locale.gen. loadLocales() strips a leading '#' and keeps
# the rest of the line as a locale name; the UTF-8 filter downstream drops most of the damage, but
# a comment that happens to contain "UTF-8" would arrive in this dialog as an entry. stage 40
# writes data lines only, and says so.
#
# WHAT IS STILL WRONG, stated rather than hidden: LCLocaleDialog renders those nine as the strings
# `de_DE.UTF-8`, `ja_JP.UTF-8` and so on. It is upstream's dialog, behind a button, with no key
# that relabels it. Nine codes behind a button is a much smaller wrong than five hundred in front
# of one, and removing the last of them means replacing this page — a separate module and a
# separate decision, since timezone is what this page is really for (plan/22 §8).
localeGenPath: "/etc/locale.gen"

geoip:
    style: "none"
