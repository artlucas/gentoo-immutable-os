# The "this is what is about to happen" page (plan/16 §5.3, replaced in plan/28 §6).
#
# It has no settings of its own, and the file exists so that calamares_add_plugin's *.conf glob
# finds one — `NO_CONFIG` would stamp `noconfig: true` into module.desc and setConfigurationMap()
# would then never be called for a page that one day has a key. The module's own CMakeLists says
# this at more length.
#
# Present in the sequence because this installer's one action is a whole-disk erase, and this is
# where the target disk is named one last time before it is rewritten. It is `review` on disk and
# "Summary" in the sidebar: a plugin called `summary` would collide file-for-file with
# app-admin/calamares' own module.
#
# WHAT CHANGED FROM THE PAGE IT REPLACES. The stock one renders each preceding step's
# prettyDescription() as a heading and a paragraph, in Breeze. This one asks the same steps for
# their prettyStatus() and draws a label/value table, in the design system — because what somebody
# needs on the last screen before an erase is every decision they made, one line each, and the
# name of the disk in a colour that says what is about to happen to it.
---
