# Where the machine is (plan/28 §6).
#
# THE PAGE THIS CONFIGURES IS OURS, and the one it replaced is gone. Calamares' `locale` module
# drew a world map, a region/zone pair and a button opening LCLocaleDialog — a list of locales
# rendered as raw codes. plan/22 §6 cut that list from five hundred entries to nine and ended by
# saying what was left:
#
#     "removing the last of them means replacing this page — a separate module and a separate
#      decision, since timezone is what this page is really for (plan/22 §8)."
#
# This is that decision. The page asks for a PLACE and nothing else: the language page already
# chose the language, and `imageidentity` writes /etc/locale.conf from it while refusing a locale
# the image cannot load. `localeGenPath` and the geoip block that used to be here have no reader
# any more — the first because there is no locale dialog to populate, the second because it was
# `style: none` for as long as it existed.
#
# The zone symlink is `localesetup`'s, in the exec phase. This page publishes locationRegion and
# locationZone — upstream's key names, because they are a published contract and not this
# module's to rename.
---
# The default pin before the user chooses. A GUESS, and deliberately one: this page opens on
# America/Toronto rather than on Etc/UTC.
#
# UTC was the honest answer to "where is this machine" and the wrong default for a page. Nothing
# on this installer detects location — the geoip block upstream shipped was `style: none` for as
# long as it existed and went with the module it configured — so the choice is between a pin that
# is right for most of the people who will boot this medium and a pin that is right for nobody.
# A person who lives here presses Next; a person who does not was always going to open the
# region list, and UTC gave them no head start either.
#
# WHAT THIS DOES NOT CHANGE: the live medium's own clock. Stage 40 symlinks /etc/localtime to UTC
# and still does, so a session that never reaches the install shows UTC — the medium's clock is
# not a statement about where the installed machine will live, and a live session that quietly
# re-dated itself would be a surprise with no page behind it. The symlink this page is responsible
# for is the TARGET's, written by `localesetup` in the exec phase from the keys below.
#
# The zone is validated against the running system's tzdata at load: LocationConfig warns and
# falls back to the region's first zone if this names something the image does not carry.
region:     "America"
zone:       "Toronto"

# Whether the page opens with "Set the time automatically over the network" ticked (plan/29).
#
# TRUE, AND IT IS A CLAIM THE PAGE THEN HAS TO MAKE GOOD. LocationViewStep::onActivate() runs
# `timedatectl set-ntp true` on this medium and watches NTPSynchronized until a server has
# actually answered — so the status line under the box says which server set the clock, or says
# that none did. A box that started ticked and did nothing would be right by accident here,
# because systemd-timesyncd is enabled in the vendor preset and has been running since boot.
#
# IT IS ALSO AN ANSWER ABOUT THE INSTALLED SYSTEM, which is the half that makes this a question
# worth asking rather than a convenience on the medium. The page publishes locationNetworkTime,
# and `localesetup` masks systemd-timesyncd in the target when it is false — so unticking this
# box produces a machine whose clock is its own, which is a real choice some people need to make
# and a choice nothing else in this installer offers.
#
# WHICH SERVERS: none are named here. build.conf's NTP_SERVERS renders a FallbackNTP= drop-in
# that every profile ships, so the medium and the machine it installs agree — and DHCP-supplied
# servers and a domain controller's NTP= both still outrank it, which is the point of the
# fallback key. See config/rootfs/etc/systemd/timesyncd.conf.d/05-distro-ntp.conf.in.
networkTime: true
