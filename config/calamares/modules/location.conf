# Where the machine is (plan/28 §6).
#
# THE PAGE THIS CONFIGURES IS OURS, and the one it replaced is gone. Calamares' `locale` module
# drew a world map, a region/zone pair and a button opening LCLocaleDialog — a list of locales
# rendered as raw codes. plan/22 §6 cut that list from five hundred entries to nine and ended by
# saying what was left:
#
#     "removing the last of them means replacing this page — a separate module and a separate
#      decision, since timezone is what this page is really for (plan/22 §8)."
#
# This is that decision. The page asks for a PLACE and nothing else: the language page already
# chose the language, and `imageidentity` writes /etc/locale.conf from it while refusing a locale
# the image cannot load. `localeGenPath` and the geoip block that used to be here have no reader
# any more — the first because there is no locale dialog to populate, the second because it was
# `style: none` for as long as it existed.
#
# The zone symlink is `localesetup`'s, in the exec phase. This page publishes locationRegion and
# locationZone — upstream's key names, because they are a published contract and not this
# module's to rename.
---
# The default pin before the user chooses. UTC is what the image ships (stage 40 symlinks
# /etc/localtime to it), so this is "unchanged" rather than a guess about where the machine is.
region:     "Etc"
zone:       "UTC"
