# console — the M1 milestone image: systemd + getty, no desktop.
#
# Replaces the old `--console-only` flag, which was a bare boolean threaded through eight files.
# It exists to validate the hard architectural risks — boot flow, /etc overlay, loopless
# assembly — without desktop complexity on top (plan/00, M1).

PROFILE_DESC="Console-only image (no desktop) — the M1 milestone image"
PROFILE_ROLE="target"
PROFILE_SETS="base hardware"

# The cjk/printing markers in config/portage/sets/desktop are moot here: every atom they gate
# lives in @desktop, which this profile does not emerge. So INCLUDE_CJK_FONTS and
# INCLUDE_PRINTING are deliberately NOT overridden — they would filter nothing, and setting them
# would only make the lock header claim a difference that does not exist.
