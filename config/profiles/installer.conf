# installer — the live medium: a Plasma session that exists to run Calamares, plus the payload
# it installs. Booted from a USB stick and thrown away; never released, never updated, never
# installed (plan/16).
#
# PROFILE_ROLE="live" is what makes the whole Calamares answer affordable. The objection to
# Calamares was never its UI — it was that its ~25-package dependency tail (GRUB with a
# legacy-BIOS platform, os-prober, squashfs-tools, boost) would ship on every installed system,
# on a distro whose identity is a minimal native footprint behind a hard audit gate. Once the
# installer lives in a profile that is built, booted and discarded, that cost moves from
# "permanent, on every machine" to "transient, on the install medium".
#
# What this profile installs is NOT itself: it is the desktop profile's artifacts, staged into
# this image's /var by stage 40 and written to disk verbatim. So a machine installed from this
# medium is indistinguishable from one dd'd from the desktop image — which is the property
# systemd-sysupdate depends on (plan/16 §3.4), and which tests/test-profiles.sh asserts.

PROFILE_DESC="Live USB installer environment (Calamares + desktop payload)"
PROFILE_ROLE="live"
PROFILE_SETS="base hardware desktop installer"

# The profile whose artifacts this medium WRITES TO DISK — its root EROFS, its UKI and its /var
# tarball, staged into this image's /var by stage 40 and copied out verbatim by Calamares. Named
# rather than assumed, so "what does this stick install?" is answered by one line of config
# instead of by reading three stages. It must be a `target` profile: validate_config refuses a
# live one, because a live medium is not something a user should end up running.
PAYLOAD_PROFILE="desktop"

# ---- what the live medium drops ---------------------------------------------------------
#
# MEASURED against the last desktop build's target rootfs, 2026-08-28, and the numbers reordered
# every guess that preceded them (plan/16 §4.1). The trim list is two lines, because two lines
# is all that is actually there:
#
#   preinstalled Flatpaks  ~2.7 GiB   dropped here; they travel in the payload instead
#   podman + distrobox       61 MiB   dropped here
#   media-fonts/noto-cjk    294 MiB   KEPT — see below
#   net-print/cups            8 MiB   NOT removable: unconditional RDEPEND of dev-qt/qtbase
#   kde-apps/kio-extras        —      NOT removable: unconditional RDEPEND of plasma-workspace
#   dolphin, partitionmanager  —      KEPT by decision: a failed install wants a file manager
#                                     and a disk tool more than any other session does
#
# The live environment is therefore much closer to the full desktop than "trimmed" suggests, and
# that is the right answer: someone whose install just failed needs a usable session.

# The single biggest saving, and the only one that matters. The apps are not lost — they are in
# the payload's var-template, so the INSTALLED system still gets them with no network.
FLATPAK_PREINSTALL=""

# 61 MiB of container runtime for a session that exists to run one installer and reboot.
INCLUDE_DISTROBOX="0"

# NOT set to 0, deliberately, and this is the one trim that would have been a bug. Dropping CJK
# fonts saves 294 MiB and breaks the thing Calamares is best at: the welcome page's first control
# is a language picker across ~80 languages, and choosing Chinese, Japanese or Korean on an image
# with no CJK glyphs renders the entire installer as tofu. Of every profile, this is the one that
# most needs those fonts.
INCLUDE_CJK_FONTS="1"

# ---- geometry ----------------------------------------------------------------------------
#
# One root slot, not two. A/B exists so an update can be written to the inactive slot and rolled
# back; a live medium is never updated (systemd-sysupdate is masked for live-role profiles by
# stage 40), so the second 6 GiB slot would be 6 GiB of zeros on every stick.
PROFILE_ROOT_SLOTS="1"

# Must hold the whole payload. MEASURED against the first desktop build that produced one,
# 2026-08-31, rather than guessed:
#
#   root.erofs     2762 MiB    the desktop root filesystem, written to the target verbatim
#   uki.efi          60 MiB
#   var.tar.zst     905 MiB    the /var seed, INCLUDING the preinstalled Flatpaks
#   ------------------------
#   payload        3727 MiB    plus ~100 MiB for the live session's own /var
#
# 5120 leaves ~1.3 GiB of headroom over that. The first estimate here was 8192, from a guess that
# the Flatpak store would compress to ~2 GiB; it compresses to 905 MiB, and the difference is not
# academic — it is the difference between a medium that fits a 16 GB USB stick and one that does
# not:
#
#   VAR_SIZE_MIB=8192  ->  1024 + 6144 + 8192 = 15362 MiB image   (a 16 GB stick holds ~15260)
#   VAR_SIZE_MIB=5120  ->  1024 + 6144 + 5120 = 12290 MiB image
#
# Sizing it tight costs nothing at runtime: repart.d/50-var.conf grows var to the end of whatever
# the image was written to on first boot, so a 32 GB stick still gets a 25 GiB /var. This value is
# only the minimum SHIPPED size.
#
# And it is checked rather than trusted: stage 60 measures what stage 40 staged and refuses to
# build an image whose var partition cannot hold it, naming the value to raise.
VAR_SIZE_MIB="5120"
