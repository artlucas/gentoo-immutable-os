# installer — the live medium: a Plasma session that exists to run Calamares, plus the payload
# it installs. Booted from a USB stick and thrown away; never released, never updated, never
# installed (plan/16).
#
# PROFILE_ROLE="live" is what makes the whole Calamares answer affordable. The objection to
# Calamares was never its UI — it was that its ~25-package dependency tail (GRUB with a
# legacy-BIOS platform, os-prober, squashfs-tools, boost) would ship on every installed system,
# on a distro whose identity is a minimal native footprint behind a hard audit gate. Once the
# installer lives in a profile that is built, booted and discarded, that cost moves from
# "permanent, on every machine" to "transient, on the install medium".
#
# What this profile installs is NOT itself: it is the desktop profile's artifacts, staged into
# this image's /var by stage 40 and written to disk verbatim. So a machine installed from this
# medium is indistinguishable from one dd'd from the desktop image — which is the property
# systemd-sysupdate depends on (plan/16 §3.4), and which tests/test-profiles.sh asserts.

PROFILE_DESC="Live USB installer environment (Calamares + desktop payload)"
PROFILE_ROLE="live"
PROFILE_SETS="base hardware domain desktop installer"

# BASE_PROFILE (plan/34 §6, renamed from PAYLOAD_PROFILE): the target profile whose root this
# medium boots and installs — its root EROFS, its UKI and its /var tarball, staged into this
# image's /var by stage 40 and copied out verbatim by Calamares. Named rather than assumed, so
# "what does this stick install?" is answered by one line of config instead of by reading three
# stages. It must be a `target` profile: validate_config refuses a live one, because a live
# medium is not something a user should end up running.
BASE_PROFILE="desktop"

# ---- superset, not subset (plan/34 §6) ---------------------------------------------------
#
# Through 0.3.1 (plan/20) this profile trimmed itself SMALLER than the desktop's: a wallpaper
# collection, Discover, Spectacle and the managed KCM by `#not-live` markers in
# config/portage/sets/desktop; a Ghostscript PDF-thumbnailer chain by a USE flag; podman and
# distrobox by INCLUDE_DISTROBOX=0 below; the managed-mode QML front end and sysupdate.d's
# transfer units by stage 40 deleting files it had just installed. Every one of those was a
# DELETION relative to the desktop tree.
#
# plan/34 §3 turns this profile's own tail (Calamares and everything below) into a systemd
# system extension: a directory tree built as the DIFFERENCE between this profile's tree and the
# desktop's (§7.2's tree-delta). A difference cannot represent "this file used to be here and
# isn't" — only "added" and "changed", both of which land in the extension or the /etc overlay's
# upper. A deletion is neither, so it has to fail the build rather than ship an extension that
# silently un-installs part of the product it is merged over. Every trim above is gone as of
# plan/34 §6: this profile's package set is now the desktop's plus the installer tail (still
# justified below), at identical versions — checked by two offline invariants
# (tests/test-pin-policy.sh): every atom in config/portage/lock/desktop.lock appears in
# installer.lock at the identical CPV, and expected-packages.installer.txt is a superset of
# expected-packages.desktop.txt.
#
# What stays, because it only ever ADDED files to the installer tree and deletes nothing from
# the desktop's: sys-boot/grub (68 MiB, never executed — the medium boots a UKI and the install
# writes systemd-boot), the Qt Linguist launchers `dev-qt/qttools[linguist]` builds and stage 50
# then deletes (package.use/profile.installer), and the IBM Plex faces. `dolphin`,
# `partitionmanager` and `kinfocenter` were always additions from `@installer`, not desktop
# trims, and stay for the same reason: a failed install wants a file manager and a disk tool
# more than any other session does.
#
# The one knob left below is identical to the desktop's, never a removal.
#
# FLATPAK_PREINSTALL is NOT overridden here any more (plan/34 §6, was `=""`). It never touched
# the package closure the superset invariants above check — it names Flatpak refs, not portage
# atoms — but it IS rendered into usr/lib/systemd/system/@DISTRO_ID@-flatpak-preinstall.service's
# ExecStart (config/rootfs/usr/lib/systemd/system/distro-flatpak-preinstall.service.in), and that
# unit is a /usr file the plan/34 §3 extension's tree-diff compares against the desktop's copy of
# itself. An empty override rendered a different ExecStart — found by the real build's tree-delta
# comparison, which is exactly the kind of drift the two trees now have to agree on. Installing
# the apps a SECOND time here from Flathub would still be redundant and slower than what plan/34
# §7.1/§9 does instead (copying the desktop build's own var.tar.zst store once Phase D lands), so
# stage 40 skips the actual install for the live role explicitly — this profile inherits
# build.conf's five apps for the sake of the rendered file, not because it installs them yet.

# Matches build.conf's own default (1) — restated here, not overridden, as a guard against a
# future accidental change. Dropping CJK fonts would save 294 MiB and break the thing Calamares
# is best at: the welcome page's first control is a language picker across ~80 languages, and
# choosing Chinese, Japanese or Korean on an image with no CJK glyphs renders the entire
# installer as tofu. Of every profile, this is the one that most needs them.
INCLUDE_CJK_FONTS="1"

# ---- geometry ----------------------------------------------------------------------------
#
# One root slot, not two. A/B exists so an update can be written to the inactive slot and rolled
# back; a live medium is never updated (systemd-sysupdate is masked for live-role profiles by
# stage 40), so the second 6 GiB slot would be 6 GiB of zeros on every stick.
PROFILE_ROOT_SLOTS="1"

# Must hold the whole payload. MEASURED against the first desktop build that produced one,
# 2026-08-31, rather than guessed:
#
#   root.erofs     2762 MiB    the desktop root filesystem, written to the target verbatim
#   uki.efi          60 MiB
#   var.tar.zst     905 MiB    the /var seed, INCLUDING the preinstalled Flatpaks
#   ------------------------
#   payload        3727 MiB    plus ~100 MiB for the live session's own /var
#
# 5120 leaves ~1.3 GiB of headroom over that. The first estimate here was 8192, from a guess that
# the Flatpak store would compress to ~2 GiB; it compresses to 905 MiB, and the difference is not
# academic — it is the difference between a medium that fits a 16 GB USB stick and one that does
# not:
#
#   VAR_SIZE_MIB=8192  ->  1024 + 6144 + 8192 = 15362 MiB image   (a 16 GB stick holds ~15260)
#   VAR_SIZE_MIB=5120  ->  1024 + 6144 + 5120 = 12290 MiB image
#
# Sizing it tight costs nothing at runtime: repart.d/50-var.conf grows var to the end of whatever
# the image was written to on first boot, so a 32 GB stick still gets a 25 GiB /var. This value is
# only the minimum SHIPPED size.
#
# And it is checked rather than trusted: stage 60 measures what stage 40 staged and refuses to
# build an image whose var partition cannot hold it, naming the value to raise.
VAR_SIZE_MIB="5120"
