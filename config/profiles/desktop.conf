# desktop — the product, and the DEFAULT profile.
#
# This is the image the project has always built: minimal KDE Plasma 6 Wayland, Flatpak-first,
# A/B updatable. It is also what the installer writes to disk, so its contents are the contents
# of an installed system.
#
# NB "profile" here is a BUILD profile, not the Gentoo portage profile in build.conf's PROFILE.
# See README.md in this directory — they are different things and both apply.

PROFILE_DESC="Minimal KDE Plasma 6 desktop — the installable product"
PROFILE_ROLE="target"
PROFILE_SETS="base hardware desktop"

# No knob overrides: this profile IS config/build.conf's defaults. Keeping it empty is the point
# — a change here changes the shipped product, so it should be made in build.conf where it is
# visible to every profile, unless it is genuinely desktop-only.
