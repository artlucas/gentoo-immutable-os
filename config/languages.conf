# config/languages.conf — the languages this distro speaks (plan/22 §2b)
#
# ONE TABLE, FOUR CONSUMERS. This file is the source of:
#
#   1. the installer's language page        (rendered into /etc/calamares/modules/language.conf)
#   2. /etc/locale.gen, and therefore the compiled locale archive   (stage 40, localedef)
#   3. the message catalogs stage 50 keeps out of /usr/share/locale (the old LOCALES_KEEP)
#   4. flatpak's xa.languages                                       (stage 40, FLATPAK_LANGS)
#
# It exists because those four used to be two unrelated strings in build.conf — LOCALE_GEN named
# one locale and LOCALES_KEEP named nine languages — and nothing compared them. The installer
# therefore offered 82 languages, the product carried 9 message catalogs, and the machine could
# load exactly 1 locale: pick anything but English and `imageidentity` warned and wrote
# LANG=en_US.UTF-8 anyway, so the installer spoke your language and the desktop it installed did
# not. A language is only real here if the MACHINE can speak it, and that means both halves —
# a catalog for the UI and a compiled locale for LANG — so both halves come out of one row.
#
# THE ORDER OF THIS FILE IS THE ORDER OF THE PICKER. That is deliberate. Sorting nine names across
# Latin, Cyrillic and Han at runtime gives an order no user would predict and no collation gets
# right; a list somebody arranged on purpose is better than a list a QCollator arranged by
# accident. Latin alphabetically, then Cyrillic, then CJK.
#
# COLUMN 3 IS OURS, NOT Qt's. QLocale::nativeLanguageName() answers "American English",
# "español de España", "português (Brasil)" and "British English (United Kingdom)" — measured
# against the medium's own Qt 6.11.1, not guessed (plan/22 §2a). Nine hand-written strings are
# cheaper than explaining why the Spanish row names a country and the German row does not, and
# they are the last mechanism by which a locale code could reach the screen.
#
# COLUMN 4 IS A SOURCE STRING, NOT A LABEL. The page draws it through
# QCoreApplication::translate("LanguageNames", ...), so what a user actually sees on the second
# line of a row is that name in the language they are pointing at — "ドイツ語", not "German", once
# 日本語 is highlighted. Every value here must therefore also appear as a <source> in the
# LanguageNames context of every .ts file under config/calamares/branding/installer/lang/.
#
# ADDING A LANGUAGE is one row and a rebuild: no lock re-resolve, because nothing here is a
# package. Two things are NOT free, and stage 40 checks both:
#
#   - the .ts file. A row with no config/calamares/branding/installer/lang/calamares-installer_<id>.ts
#     fails the build rather than shipping a page that falls back to English on one screen in
#     eight (plan/22 §4).
#   - the layout. Nine rows at 44px is 396px of a 536px viewport, so the list needs no scrollbar
#     and no search field; past eleven it needs both. And an RTL language — Arabic, Hebrew,
#     Persian, Urdu — flips the whole window through QApplication::setLayoutDirection, which is a
#     layout to design and test and not a row to append. stage 40 refuses the known RTL ids for
#     that reason; delete the guard when the design exists, not before.
#
# Format: four '|'-separated fields. '#' comments and blank lines are ignored.
#
#   id      | locale       | shown as            | in English (a LanguageNames source string)
# ----------+--------------+---------------------+--------------------------------------------
de          | de_DE.UTF-8  | Deutsch             | German
en          | en_US.UTF-8  | English             | English
es          | es_ES.UTF-8  | Español             | Spanish
fr          | fr_FR.UTF-8  | Français            | French
it          | it_IT.UTF-8  | Italiano            | Italian
pt_BR       | pt_BR.UTF-8  | Português (Brasil)  | Portuguese (Brazil)
ru          | ru_RU.UTF-8  | Русский             | Russian
ja          | ja_JP.UTF-8  | 日本語               | Japanese
zh_CN       | zh_CN.UTF-8  | 简体中文             | Chinese (Simplified)
