# NetworkManager DNS handling for an image where systemd-resolved owns resolution
# (see /etc/nsswitch.conf and the resolv.conf symlink made in stage 40).
#
# dns=systemd-resolved — hand per-link DNS servers and search domains to resolved
#   over D-Bus. NM does auto-detect resolved when /etc/resolv.conf already points
#   at the stub, but that detection is a heuristic on a file the /etc overlay lets
#   anyone replace; stating the backend is cheaper than debugging the day it
#   guesses differently.
# rc-manager=unmanaged — and never write /etc/resolv.conf itself. That file is our
#   symlink to resolved's stub; NM overwriting it with its own copy would quietly
#   cut resolved out of the path for everything using the "dns" nsswitch fallback,
#   and would put the leased nameservers back into a file that is meant to be
#   generated, exactly the leak commit 9284cec removed.
[main]
dns=systemd-resolved
rc-manager=unmanaged
