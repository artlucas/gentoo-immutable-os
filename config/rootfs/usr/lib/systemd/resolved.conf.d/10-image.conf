# systemd-resolved settings for this image. Anything not set here is left at
# systemd's own default on purpose — this drop-in exists for one decision:
#
# LLMNR is a Windows-specific name protocol that nothing in this image speaks,
# and resolved runs it as a *responder* by default: the host answers name queries
# from anything on the same L2 segment, on every café and conference network it
# joins. Off. MulticastDNS stays at its default because .local discovery is
# something a desktop genuinely uses (printers and the like).
[Resolve]
LLMNR=no
