# Leave the splash's last frame on the screen when plymouthd exits, so the Plasma Login Manager
# greeter paints over the logo instead of over black.
#
# plan/08 open question 6, and the one visible regression the GNOME->Plasma swap introduced.
# gdm[plymouth] quit the splash itself with --retain-splash once the greeter had painted; Plasma
# Login Manager has no plymouth integration of any kind, so plymouth-quit.service does the
# teardown — and a plain `plymouth quit` resets the console, which blanks the screen for the
# fraction of a second before kwin's first frame. Deterministic (plasmalogin.service is ordered
# after plymouth-quit-wait) but visibly black.
#
# --retain-splash skips exactly that console reset. plymouthd still exits, every unit ordering
# stays as it was, and the framebuffer keeps showing the last frame until something draws over
# it. One drop-in, no new dependencies, and nothing else in the boot changes.
#
# ExecStart is CLEARED FIRST, and that empty assignment is not optional: ExecStart in a
# Type=oneshot unit is additive, so without the reset systemd would run the vendor's
# `plymouth quit` and then ours, and the first one would already have reset the console.
#
# The "-" is kept from the vendor line: with SPLASH_BACKEND=none or plymouth.enable=0 there is no
# plymouthd listening and `plymouth quit` exits non-zero. That must not fail the unit — nothing
# downstream should care that there was no splash to tear down.
#
# NOT INSTALLED ON --console-only IMAGES. Stage 40 removes this file when CONSOLE_ONLY=1: there
# the next thing to touch the screen is agetty, which draws its login prompt into the same
# framebuffer, so a retained splash would sit behind the text instead of being replaced by a
# greeter. The console image keeps the plain teardown it has always had.
#
# Like everything else about the splash, invisible to every automated test in this repo — stage
# 70 reads a serial port. Verify in QEMU (scripts/run-vm.sh) after any change here.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
