[Unit]
# GDM had a plymouth USE flag: gdm.service conflicted with plymouth-quit.service and quit the
# splash itself with --retain-splash once the greeter had painted, which is what kept that
# hand-off from flashing black. Plasma Login Manager has no equivalent, so the splash is torn
# down by plymouth-quit.service exactly as it is on the console-only image, and the login
# manager is ordered strictly after it.
#
# Deterministic hand-off rather than a race. Without this ordering the greeter and
# plymouth-quit-wait can reach the display at the same time, which shows up as a flash — and
# shows up nowhere in any log, so it is worth one drop-in to make impossible.
#
# THE BLACK FRAME THIS ORDERING USED TO GUARANTEE IS GONE, and not from here: the retain-splash
# half now lives in plymouth-quit.service.d/10-retain-splash.conf, which changes what that unit
# runs rather than who runs it. Doing it there instead of here is deliberate — the obvious
# alternative was to give this unit "Conflicts=plymouth-quit.service" plus an ExecStartPre, the
# shape gdm uses, and it does not port: kde-plasma/plasma-login-manager's own unit already
# carries "After=plymouth-quit.service", so plymouth-quit would still win the race to the screen
# on any boot where multi-user.target reached it first, and adding "After=plymouth-quit-wait"
# on top of an ExecStartPre that is the only thing that ever quits plymouthd deadlocks the two
# units against each other. Changing the teardown itself has neither problem and needs no
# ordering changes at all — which is why this file is unchanged from the version that predates
# the splash work.
After=plymouth-quit-wait.service
