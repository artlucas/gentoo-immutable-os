[Unit]
# GDM had a plymouth USE flag: gdm.service conflicted with plymouth-quit.service and quit the
# splash itself with --retain-splash once the greeter had painted, which is what kept that
# hand-off from flashing black. Plasma Login Manager has no equivalent, so the splash is torn
# down by plymouth-quit.service exactly as it is on the console-only image, and the login
# manager is ordered strictly after it.
#
# Deterministic hand-off rather than a race. Without this ordering the greeter and
# plymouth-quit-wait can reach the display at the same time, which shows up as a flash — and
# shows up nowhere in any log, so it is worth one drop-in to make impossible.
# Restoring a retain-splash hand-off is a plan/08 roadmap item.
After=plymouth-quit-wait.service
