# sssd must not run on a machine that has never been joined (plan/18 §5.1).
#
# This is not tidiness. systemd-boot-check-no-failures.service is enabled in the vendor preset
# and gates boot-complete.target, which is what marks a UKI good — so on this system a unit that
# starts and FAILS is a failed boot: the boot counter is not cleared, and after three of them
# systemd-boot falls back to the previous image (plan/01, "Automatic Boot Assessment"). On a
# factory image, where there is no previous image, it simply fails every boot forever.
#
# sssd exits non-zero with no configuration file, so an unjoined machine shipping @domain would
# do exactly that. A unit whose Condition fails is recorded as SKIPPED, not failed, and skipped
# is precisely the distinction boot-check-no-failures cares about.
#
# Belt and braces with the preset's `disable sssd.service`, deliberately: a preset that quietly
# did not take has produced a broken image in this project before, and the two mechanisms fail
# independently. <distro>-domain join creates the file and enables the unit; leave removes both.
[Unit]
ConditionPathExists=/etc/sssd/sssd.conf
