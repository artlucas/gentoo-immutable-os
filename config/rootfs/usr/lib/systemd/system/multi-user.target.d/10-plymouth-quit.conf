# Upstream plymouth ships multi-user.target.wants/ symlinks for these two, and its units carry
# no [Install] section — so if a Gentoo revision ever stops installing those symlinks, nothing
# would tear the splash down and a --console-only image (which has no display manager to do it
# instead) would boot to a login prompt hidden behind the logo. Stated explicitly here rather
# than depended upon, exactly as the unit preset does with its disables.
#
# Load-bearing on BOTH images now, not just the console-only one. Under GNOME this was
# merely harmless on the desktop image, because gdm[plymouth] conflicted with
# plymouth-quit.service and quit the splash itself with --retain-splash. Plasma Login Manager
# has no equivalent flag, so plymouth-quit.service is what tears the splash down everywhere,
# and plasmalogin.service is ordered after plymouth-quit-wait to keep the hand-off from
# flashing (see its 10-plymouth.conf drop-in).
[Unit]
Wants=plymouth-quit.service plymouth-quit-wait.service
