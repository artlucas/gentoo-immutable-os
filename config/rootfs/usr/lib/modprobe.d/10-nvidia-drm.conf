# Make the NVIDIA DRM device appear on its own, as early as udev sees the GPU.
#
# THE PROBLEM THIS SOLVES. nvidia.ko carries PCI aliases, so udev modprobes it from the modalias
# like any other driver. nvidia-modeset.ko and nvidia-drm.ko carry NONE — nothing in sysfs ever
# names them — so on a stock system they are loaded by whatever ran `modprobe nvidia-drm` first,
# which in a normal boot is the display manager's udev environment. Until that happens an NVIDIA
# machine has no DRM device at all.
#
# WHAT THAT COSTS WITHOUT THIS FILE, and it is not only the splash: /dev/dri/card0 appears only
# once the display manager is already starting, so the boot splash (plan/14) has nothing to draw
# on for most of the boot and appears, if at all, moments before the greeter paints over it. One
# softdep moves the whole thing to the point udev binds the GPU.
#
# This used to matter in the initrd too — plan/11 finding 4 put all three modules in the
# initramfs so plymouth could draw there, at a cost of 98 MiB of GSP firmware on the ESP. The
# initrd carries no graphics at all now (plan/14) and the splash runs from the root filesystem,
# so this file's only consumer is the booted system. That is a reduction in scope, not in
# importance: it is still the only thing that loads nvidia-drm.
#
# WHY NOT modules-load.d, which is the obvious alternative: that loads nvidia.ko unconditionally
# — including on every AMD and Intel machine, where it finds no GPU, wastes the probe and holds
# the memory. The softdep fires only when something actually matched an NVIDIA device.
#
# NB this file is /usr/lib, not /etc: x11-drivers/nvidia-drivers owns /etc/modprobe.d/nvidia.conf
# (the nouveau blacklist and the suspend options), and a second file at the same path would
# collide with it on every driver bump. Vendor policy belongs in /usr/lib, and the /etc overlay
# (plan/01) still lets a user override it.
softdep nvidia post: nvidia-modeset nvidia-drm
