# Make the NVIDIA DRM device appear on its own, in the initrd as well as on the booted system.
#
# THE PROBLEM THIS SOLVES. nvidia.ko carries PCI aliases, so udev modprobes it from the modalias
# like any other driver. nvidia-modeset.ko and nvidia-drm.ko carry NONE — nothing in sysfs ever
# names them — so on a stock system they are loaded by whatever ran `modprobe nvidia-drm` first,
# which in a normal boot is the display manager's udev environment, long after the initrd.
# The consequence for this image was recorded in plan/08 as an accepted tradeoff: the initrd had
# no usable DRM device on NVIDIA at all, so plymouth waited out DeviceTimeout=8 and fell back to
# the text splash — every NVIDIA machine, every boot, with nothing logged.
#
# One softdep fixes it in both places. Stage 40 adds the three modules to the initramfs
# (--add-drivers), udev autoloads nvidia there exactly as it does on the root filesystem, and
# this line pulls the other two in behind it. dracut copies both /etc/modprobe.d and
# /usr/lib/modprobe.d into the initramfs, so this one file serves the initrd and the booted
# system without being installed twice.
#
# WHY NOT --force-drivers, which would have needed no file at all: it writes a modules-load.d
# entry, which loads nvidia.ko unconditionally — including on every AMD and Intel machine, where
# it finds no GPU, wastes the probe and holds the memory. The softdep fires only when something
# actually matched an NVIDIA device.
#
# NB this file is /usr/lib, not /etc: x11-drivers/nvidia-drivers owns /etc/modprobe.d/nvidia.conf
# (the nouveau blacklist and the suspend options), and a second file at the same path would
# collide with it on every driver bump. Vendor policy belongs in /usr/lib, and the /etc overlay
# (plan/01) still lets a user override it.
softdep nvidia post: nvidia-modeset nvidia-drm
