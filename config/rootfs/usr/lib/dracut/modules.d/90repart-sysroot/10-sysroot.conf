# Installed into the INITRD ONLY, by the 90repart-sysroot dracut module — see its
# module-setup.sh for why this is needed and why it must not ship in the image.
#
# systemd-repart resolves the disk to repartition from the backing device of /sysusr/usr or
# /sysroot/usr. A dracut initrd has mounted neither when the stock unit orders itself to run,
# so it exits 1 and the initrd reboots. Wait for the root filesystem to be there.
[Unit]
Requires=sysroot.mount
After=sysroot.mount
