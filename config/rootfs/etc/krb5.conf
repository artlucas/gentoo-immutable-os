# /etc/krb5.conf — MIT Kerberos, shipped domain-ready and never edited (plan/18 §2).
#
# There is no realm configured here, and there is not meant to be. Joining a domain writes
# /etc/krb5.conf.d/<distro>_domain into the /etc overlay; this file is in the read-only lower and
# stays there, still receiving vendor updates. Editing it instead would copy it up and freeze it
# at one release's content forever, because the overlay has no 3-way merge (plan/01).
#
# app-crypt/mit-krb5 installs NO krb5.conf of its own, so this is not an override of a vendor
# file — it is the only one.

includedir /etc/krb5.conf.d/

[libdefaults]
    # No default_realm. An unjoined machine has no realm, and inventing one here would make
    # every kinit fail with a confusing name rather than an honest "cannot find KDC".
    # The join drop-in supplies default_realm, and nothing else needs to.

    # Active Directory publishes _kerberos._udp / _kerberos-master._tcp SRV records and a
    # _kerberos TXT record for the realm, so both of these resolve the domain with no static
    # [realms] or [domain_realm] block. This is the whole reason the drop-in can be four lines.
    dns_lookup_realm = true
    dns_lookup_kdc   = true

    # AD issues tickets against the forward name. Canonicalizing the client's own address
    # backwards through PTR is how a machine with a wrong or absent reverse zone — which is most
    # of them — ends up requesting a principal the KDC has never heard of.
    rdns = false

    # A ticket that outlives the working day, renewable for a week, which is what AD's own
    # defaults look like.
    ticket_lifetime  = 24h
    renew_lifetime   = 7d
    forwardable      = true

    # The kernel keyring, not a file in /tmp: the ccache dies with the session, is not readable
    # by another uid, and needs no cleanup on a machine whose /tmp is a tmpfs. sssd writes the
    # same template into sssd.conf so PAM-obtained tickets land in the same place.
    default_ccache_name = KEYRING:persistent:%{uid}
