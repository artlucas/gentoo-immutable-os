# /etc/nsswitch.conf — glibc Name Service Switch.
#
# Shipped in the read-only /etc lower dir; the boot-time /etc overlay makes it
# editable at runtime. Three lines here are deliberate:
#
#  1. "resolve" routes host lookups through systemd-resolved's varlink socket
#     instead of through the "dns" module + /etc/resolv.conf, which is what
#     gives the image per-link DNS, DNS caching and a single place where
#     NetworkManager publishes servers.
#  2. "[!UNAVAIL=return]" after it means: trust whatever resolved answers,
#     including NXDOMAIN, and only fall through when resolved is not running.
#     Without it every negative answer gets re-asked of every later module.
#     "dns" therefore stays last, as the fallback for exactly that case.
#     There is deliberately no "mymachines": that module comes from
#     systemd[importd], which this image does not build (config/portage/
#     package.use/image), and naming an absent module only yields lookup errors.
#  3. "systemd" on the user/group lines (nss-systemd) resolves DynamicUser=
#     service identities. Without it those users are invisible to getpwnam and
#     files they own show up as bare uids.
#  4. "sss" ships here even on a machine that has never been joined to an
#     Active Directory domain, and that is deliberate (plan/18 §2). This file
#     is in the read-only lower; editing it at join time would copy it up into
#     the /etc overlay and freeze it against every future release, because the
#     overlay has no 3-way merge (plan/01). So the image is domain-READY and a
#     join writes only files that did not exist before. Unjoined, nss_sss finds
#     no socket, returns unavailable, and the next module answers — which is
#     asserted by T-DOM-4 rather than assumed.
#     NOT on "shadow": sssd's NSS responder does not serve shadow entries.
#     Authentication goes through pam_sss, not through a shadow lookup.

passwd:     files sss systemd
group:      files [SUCCESS=merge] sss [SUCCESS=merge] systemd
shadow:     files systemd
gshadow:    files systemd

hosts:      resolve [!UNAVAIL=return] files myhostname dns
networks:   files

services:   files
protocols:  files
rpc:        files
ethers:     files
netgroup:   files
automount:  files
aliases:    files
publickey:  files
